name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同じ枝・PR に続けて push したら、古い方の実行は止める
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.x"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # テストは kitty・Chrome・KWin・Node を使わない（どれも偽物）。git と pgrep（procps）は ubuntu-latest に入っている
      - name: Run all tests
        run: |
          python --version
          python tests/run.py

  # 3.9 は macOS の /usr/bin/python3（Xcode CLT）。setup-python では入らなくなったので、公式のイメージで回す
  test-py39:
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - name: Install git and procps, put python3 in /usr/bin
        # テストは PATH を /usr/bin:/bin に絞って install.sh を回すので、macOS と同じく /usr/bin/python3 を置く
        run: |
          apt-get update && apt-get install -y --no-install-recommends git procps
          ln -sf /usr/local/bin/python3 /usr/bin/python3
      - uses: actions/checkout@v5
      - name: Run all tests
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          git config --global init.defaultBranch main
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python --version
          python tests/run.py
