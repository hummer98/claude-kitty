# macOS 用の claude-kitty.conf（中身は同じで、listen_on だけ /tmp。macOS には $XDG_RUNTIME_DIR が無く、
# 道具は XDG_RUNTIME_DIR が無ければ /tmp/kitty-<pid> を探す）。tools/install.sh --kitty が macOS ではこちらを足す。
# kitty の include の相対パスは kitty の設定ディレクトリから解かれるので、claude-kitty.conf を include せずに写している。
allow_remote_control socket-only
# kitty ごとに別のソケット（名前は kitty-<pid> のまま）
listen_on unix:/tmp/kitty-{kitty_pid}
# claude-view は splits の分割の木を前提にする。stack は 1 枚を拡大して見る補助
enabled_layouts splits,stack
# 入力待ちのたびのデスクトップ通知を止める（待受中はペインの色で分かる）
filter_notification all
# claude-state の「完了（未読）」を、ペインにフォーカスが来たら元の色に戻す。
# 相対パスは kitty の設定ディレクトリから解かれるので、~/.config/kitty/claude_state_watcher.py にリンクを張る（install.sh が張る）
watcher claude_state_watcher.py
