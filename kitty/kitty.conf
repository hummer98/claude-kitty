# claude-code を並べて動かす用。外部（claude-code の Bash ツール含む）からレイアウトを操作するため
# ソケット経由のリモート操作だけを許す（tty 経由は Bash ツールから使えないことがある）
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}

# 任意の位置に分割・移動できる splits を主に、1 枚を拡大して見る stack を補助に
enabled_layouts splits,stack

# どのペインがアクティブか分かりやすく
active_border_color #e0a000
inactive_text_alpha 0.8

# Konsole の Noto Sans Mono は fontconfig で等幅（spacing=100）扱いされず kitty が拒否し、
# CJK 版に置き換わって英字が全角幅に広がる。等幅扱いされる Adwaita Mono（合字なし）を使う
font_family      family="Adwaita Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0
# fontconfig の monospace は KR 版の CJK を返し、漢字が韓国風の字形になるので日本語版を明示する
symbol_map U+3000-U+30FF,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF Noto Sans Mono CJK JP

# 背景を Konsole の既定の配色（Breeze）にそろえる（真っ黒だと強すぎるため）
background #232627
foreground #fcfcfc

# claude-code が入力待ちのたびに出すデスクトップ通知は止める（待受中はペインの色で知らせる）。
# 人を呼ぶのは統括が必要なときに自分で行う
filter_notification all

# claude-state の「完了（未読）」の緑を、ペインにフォーカスが来たら元の色に戻す（kitty の設定ディレクトリからの相対パス。
# ~/.config/kitty/claude_state_watcher.py にリポジトリの kitty/claude_state_watcher.py へのリンクを張る）。
# 設定の読み直しで前からあるペインに付くのは on_tab_bar_dirty の経路だけ（on_focus_change は新しいペインから）
watcher claude_state_watcher.py
