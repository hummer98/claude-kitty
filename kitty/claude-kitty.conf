# claude-kitty が要る kitty の設定だけ（フォントや色は入れない）。自分の kitty.conf の末尾から読み込む:
#   include /path/to/claude-kitty/kitty/claude-kitty.conf
# tools/install.sh --kitty がこの 1 行を足す。allow_remote_control と listen_on は kitty の起動時にしか読まれない。

# Claude Code の Bash ツールから kitten @ を使うため、ソケット経由のリモート操作だけを許す
# （yes にするとペインの中の何でも kitty を操作できてしまう）
allow_remote_control socket-only
# kitty ごとに別のソケット。ツールは $KITTY_LISTEN_ON か $XDG_RUNTIME_DIR/kitty-<pid> を探す（名前は kitty-<pid> のまま）
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}
# claude-view は splits の分割の木を前提にする。stack は 1 枚を拡大して見る補助
enabled_layouts splits,stack
# 入力待ちのたびのデスクトップ通知を止める（待受中はペインの色で分かる）
filter_notification all
# claude-state の「完了（未読）」を、ペインにフォーカスが来たら元の色に戻す。
# 相対パスは kitty の設定ディレクトリから解かれるので、~/.config/kitty/claude_state_watcher.py にリンクを張る（install.sh が張る）
watcher claude_state_watcher.py
